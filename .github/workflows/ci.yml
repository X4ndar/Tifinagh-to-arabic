name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build
      - name: CLI smoke test
        run: |
          out=$(node dist/cli/bin.js --text "ⵜⴰⵎⴰⵣⵉⵖⵜ")
          test "$out" = "تامازيغت"
          printf 'ⴰⵣⵓⵍ\n\nⴰⵎⵖⴰⵔ' | node dist/cli/bin.js > out.txt
          printf 'أزول\n\nأمغار' | cmp - out.txt
          out=$(node dist/cli/bin.js --from arabic --text "تامازيغت")
          test "$out" = "ⵜⴰⵎⴰⵣⵉⵖⵜ"
      - name: Packed tarball works when installed (CJS, ESM, CLI, types, Python)
        run: bash scripts/smoke-pack.sh
      - name: Package exports
        run: |
          node -e "const m=require('./dist/index.js'); if (m.toArabic('ⴰⵣⵓⵍ')!=='أزول') process.exit(1)"
          node --input-type=module -e "import m from './dist/index.js'; if (m.convert('ⴰⵎⵖⴰⵔ',{to:'arabic'}).output!=='أمغار') process.exit(1)"
          node --input-type=module -e "import { fromArabic } from './dist/index.js'; if (fromArabic('أمغار')!=='ⴰⵎⵖⴰⵔ') process.exit(1)"
          npm pack --dry-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python bridge
        run: python -m unittest discover -s python/tests -v
      - name: Evaluation (shipped datasets)
        run: node benchmarks/evaluate.mjs

  thorough:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Property, metamorphic and round-trip tests at 20,000 cases each
        run: npm run test:heavy
      - name: Install Playwright and Chromium (not a library dependency)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Demo end-to-end and accessibility (axe-core)
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - name: Build and start the image exactly as Coolify would (plus a local port)
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            [ "$s" = healthy ] && exit 0
            sleep 2
          done
          docker compose logs app; exit 1
      - name: Check the page and the API
        run: |
          set -e
          curl -fsS localhost:3000/healthz
          curl -fsS localhost:3000/ | grep -q 'Tamazight in Arabic letters'
          out=$(curl -fsS -X POST localhost:3000/api/transliterate -H 'Content-Type: application/json' -d '{"text":"ⵜⴰⵎⴰⵣⵉⵖⵜ"}')
          echo "$out" | grep -q '"output":"تامازيغت"'
          test "$(docker exec "$(docker compose ps -q app)" id -un)" = node
      - name: Stops cleanly on SIGTERM
        run: |
          docker compose stop
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq app)")" = 0

